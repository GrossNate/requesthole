services:
  backend:
    build:
      context: ./requesthole_backend
    restart: always
    # Internal-only: reachable as http://backend:3000 on the compose network.
    environment:
      DATABASE_PATH: /data/requesthole.db
      # Resource bounds — all optional; these are the defaults. See the
      # README's Configuration table.
      # RETENTION_DAYS: 7
      # MAX_REQUESTS_PER_HOLE: 100
      # HOLE_CREATE_RATE_LIMIT: 10
      # CAPTURE_RATE_LIMIT: 60
      # MAX_HOLES: 1000
      # MAX_HOLES_PER_IP: 20
      # MAX_BODY_BYTES: 1048576
    volumes:
      # Directory volume, not a single file: SQLite WAL mode writes .db + -wal + -shm
      # sidecars that must sit together and persist.
      - data:/data

  nginx:
    build:
      context: ./requesthole_frontend
    restart: always
    # The only service published to the host.
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  data:
