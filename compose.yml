services:
  backend:
    build:
      context: ./requesthole_backend
    restart: always
    # Internal-only: reachable as http://backend:3000 on the compose network.
    environment:
      DATABASE_PATH: /data/requesthole.db
      TRUSTED_PROXY_ADDRESS: ${NGINX_PROXY_ADDRESS:-172.31.255.2}
      # Resource bounds — all optional; these are the defaults. See the
      # README's Configuration table.
      # RETENTION_DAYS: 7
      # MAX_REQUESTS_PER_HOLE: 100
      # HOLE_CREATE_RATE_LIMIT: 10
      # CAPTURE_RATE_LIMIT: 60
      # MAX_HOLES: 1000
      # MAX_HOLES_PER_IP: 20
      # MAX_BODY_BYTES: 1048576
      # Store and serve media and binary bodies; off, RequestHole is text-only.
      # ALLOW_MEDIA: "false"
    volumes:
      # Directory volume, not a single file: SQLite WAL mode writes .db + -wal + -shm
      # sidecars that must sit together and persist.
      - data:/data
    networks:
      - backend_private
    healthcheck:
      # This route queries SQLite, so a 200 means both Fastify and storage are ready.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/holes').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./requesthole_frontend
    restart: always
    # The only service published to the host.
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      backend_private:
        ipv4_address: ${NGINX_PROXY_ADDRESS:-172.31.255.3}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  data:

networks:
  backend_private:
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.31.255.0/24}
