services:
  requesthole-postgres:
    image: 'postgres:17-alpine'
    restart: always
    # Internal-only: no host port mapping (was 5432:5432).
    env_file:
      - .env.docker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./requesthole_backend
    restart: always
    # Internal-only: reachable as http://backend:3000 on the compose network.
    env_file:
      - .env.docker
    depends_on:
      requesthole-postgres:
        condition: service_healthy

  nginx:
    build:
      context: ./requesthole_frontend
    restart: always
    # The only service published to the host.
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  postgres-data:
