services:
  backend:
    build:
      context: ./requesthole_backend
    restart: always
    # Internal-only: reachable as http://backend:3000 on the compose network.
    environment:
      DATABASE_PATH: /data/requesthole.db
    volumes:
      # Directory volume, not a single file: SQLite WAL mode writes .db + -wal + -shm
      # sidecars that must sit together and persist.
      - data:/data

  nginx:
    build:
      context: ./requesthole_frontend
    restart: always
    # The only service published to the host.
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - backend

volumes:
  data:
