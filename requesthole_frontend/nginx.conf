server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1) API + SSE — proxy every /api/* request to the backend.
    #    SSE-safe: HTTP/1.1, no proxy buffering, clear the Connection header,
    #    and effectively disable the read timeout so long-lived event streams
    #    (/api/hole/:addr/events) are not cut off.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # 2) Collect capture — a bare 6-char alphanumeric address, any method.
    #    Mirrors fastify.all("/:hole_address"). Bare address only, no sub-paths.
    location ~ "^/[a-zA-Z0-9]{6}$" {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) Static assets + SPA fallback (client routes like /view/:addr).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
